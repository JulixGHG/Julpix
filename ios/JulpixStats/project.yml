name: JulpixStats
options:
  bundleIdPrefix: com.julpix
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
targets:
  JulpixStats:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: JulpixStats
    info:
      path: JulpixStats/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julpix.stats
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
